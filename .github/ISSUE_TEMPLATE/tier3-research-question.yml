name: Tier3 Research Question
description: Submit a technical or research question with input code, files, and screenshots.
title: "[Tier3]: "
body:
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Name, company, and email for follow-up.
      placeholder: Jane Doe, ExampleCo, jane@example.com
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Normal
        - High
        - Urgent
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need Tier3 to answer?
      placeholder: Describe the research/technical question and the decision this answer will support.
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System Details
      description: Molecule/system, method, basis set, backend, versions, or other relevant setup.
      placeholder: Molecule/system, active space, ansatz, optimizer, simulator/hardware, package versions...
    validations:
      required: false

  - type: upload
    id: input-files
    attributes:
      label: Input Code or Files
      description: Upload input scripts, configs, notebooks, logs, or zipped repro files.
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots or Images
      description: Upload plots, UI screenshots, diagrams, or error images.
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Observed Output or Error
      description: Paste the relevant output if it is small enough.
      render: shell
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Answer
      description: What would count as a complete answer?
      placeholder: Explanation, corrected input, interpretation, recommended baseline, reproducibility check...
    validations:
      required: true

  - type: checkboxes
    id: confidentiality
    attributes:
      label: Confidentiality
      options:
        - label: This ticket does not include credentials, API keys, private tokens, or production secrets.
          required: true
        - label: This ticket includes confidential or proprietary input that needs restricted access.
          required: false
